<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Screenshare Doctor social card</title>
<!-- Rendered to site/assets/social-card.png by scripts/render-social-card.sh (1280x640). -->
<style>
@font-face { font-family: "Red Hat Display"; src: url("../../site/assets/fonts/red-hat-display.woff2") format("woff2"); font-weight: 300 900; }
@font-face { font-family: "Red Hat Text"; src: url("../../site/assets/fonts/red-hat-text.woff2") format("woff2"); font-weight: 300 700; }
@font-face { font-family: "Red Hat Mono"; src: url("../../site/assets/fonts/red-hat-mono.woff2") format("woff2"); font-weight: 300 700; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
body { background: #1b1d24; color: #fff; font-family: "Red Hat Text", sans-serif; display: grid; grid-template-columns: 560px 1fr; }
.bars { display: grid; grid-template-rows: 67fr 8fr 25fr; position: relative; }
.bars > div { display: grid; }
.top, .mid { grid-template-columns: repeat(7, 1fr); }
.top i:nth-child(1) { background: #c0c0c0; } .top i:nth-child(2) { background: #c0c000; } .top i:nth-child(3) { background: #00c0c0; }
.top i:nth-child(4) { background: #00c000; } .top i:nth-child(5) { background: #c000c0; } .top i:nth-child(6) { background: #c00000; } .top i:nth-child(7) { background: #0000c0; }
.mid i:nth-child(1) { background: #0000c0; } .mid i:nth-child(2n) { background: #131313; } .mid i:nth-child(3) { background: #c000c0; }
.mid i:nth-child(5) { background: #00c0c0; } .mid i:nth-child(7) { background: #c0c0c0; }
.low { grid-template-columns: 5fr 5fr 5fr 5fr 1.33fr 1.33fr 1.34fr 4fr; }
.low i:nth-child(1) { background: #00214c; } .low i:nth-child(2) { background: #fff; } .low i:nth-child(3) { background: #32006a; }
.low i:nth-child(4), .low i:nth-child(6), .low i:nth-child(8) { background: #131313; } .low i:nth-child(5) { background: #090909; } .low i:nth-child(7) { background: #1d1d1d; }
.ident { position: absolute; left: 50%; top: 33.5%; transform: translate(-50%, -50%); background: rgba(19,19,19,.92); padding: 18px 30px; border-radius: 8px;
  font: 600 30px "Red Hat Mono", monospace; text-align: center; white-space: nowrap; }
.ident span { display: block; color: #ff6b6b; font-weight: 500; font-size: 24px; margin-top: 4px; }
.ident span::before { content: ""; display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: currentColor; margin-right: 10px; }
.text { padding: 64px 64px 56px 60px; display: flex; flex-direction: column; }
.name { font: 800 30px "Red Hat Display", sans-serif; color: #00c0c0; }
h1 { margin: 30px 0 0; font: 850 62px/1.02 "Red Hat Display", sans-serif; letter-spacing: -0.02em; }
p { margin: 26px 0 0; font-size: 25px; line-height: 1.4; color: #c9ccd4; }
.foot { margin-top: auto; font-size: 21px; color: #c9ccd4; }
.foot b { color: #fff; }
</style>
</head>
<body>
  <div class="bars">
    <div class="top"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="mid"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="low"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="ident">Screen sharing<span>no signal</span></div>
  </div>
  <div class="text">
    <div class="name">Screenshare Doctor</div>
    <h1>Why does screen sharing fail on my Wayland desktop?</h1>
    <p>Start from the app and the symptom. Get the layer at fault, with the evidence and the fix.</p>
    <div class="foot"><b>GNOME, KDE Plasma, Hyprland.</b> Read-only, starts nothing.<br>github.com/BhuwanJoshi-01/screenshare-doctor</div>
  </div>
</body>
</html>
