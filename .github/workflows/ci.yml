name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: mypy
        run: uv run mypy

  test:
    # Linux only: the tool diagnoses Linux desktops. The tests run on fixtures and
    # need no Wayland session, D-Bus or PipeWire on the runner.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -q --cov --cov-report=term

  package:
    # The wheel a user installs must work on its own: build it, install it into an empty
    # environment (no repository, no dev tools) and run the installed command on a runner
    # that has no desktop session, which the tool must report without failing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build the sdist and wheel
        run: uv build
      - name: The wheel carries the data files
        run: |
          wheel=$(ls dist/*.whl)
          for file in bundles/desktops.json troubleshoot/symptoms.json troubleshoot/apps.json; do
            python -m zipfile -l "$wheel" | grep -q "screenshare_doctor/$file" || { echo "::error::$file missing from $wheel"; exit 1; }
          done
      - name: Install the wheel into a fresh environment
        run: |
          uv venv "$RUNNER_TEMP/fresh" --python 3.12
          uv pip install --python "$RUNNER_TEMP/fresh" dist/*.whl
      - name: Run the installed command
        run: |
          bin="$RUNNER_TEMP/fresh/bin"
          "$bin/screenshare-doctor" --version
          "$bin/screenshare-doctor" --help > /dev/null
          "$bin/screenshare-doctor" rules list > /dev/null
          "$bin/screenshare-doctor" doctor --format json > report.json
          "$bin/python" -c "import json; d = json.load(open('report.json')); assert d['schema_version'] == 1 and d['findings'] and d['summary']['counts']"
          "$bin/screenshare-doctor" troubleshoot screenshare --app firefox --symptom no-picker > /dev/null

  audit:
    # Known vulnerabilities in the runtime dependencies (not the dev tools).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: pip-audit
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > requirements.txt
          uvx pip-audit --strict --requirement requirements.txt

  dependency-review:
    # Flags vulnerable or license-incompatible dependencies a pull request adds.
    # GitHub offers it on public repositories; skipped while this one is private.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
